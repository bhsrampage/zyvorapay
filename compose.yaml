services:
  postgres:
    image: postgres:17
    container_name: zyvorapay-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: zyvorapay
      POSTGRES_USER: zyvorapay
      POSTGRES_PASSWORD: zyvorapay_dev_123

    ports:
      - "5432:5432"

    volumes:
      - zyvorapay_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyvorapay -d zyvorapay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zyvorapay_postgres_data: