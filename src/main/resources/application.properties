# Application
spring.application.name=zyvorapay
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8080
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# PostgreSQL Connection (values in .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret.key=${JWT_SECRET_KEY:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction}
jwt.expiration.ms=86400000
jwt.issuer=zyvorapay

# API Configuration
api.version=v1
